name: Whale Scanner — Post-Session Predictions

on:
  schedule:
    # After pre-market ends (6:00 AM ET = 10:00 UTC)
    - cron: '5 10 * * 1-5'
    # After regular session ends (4:00 PM ET = 20:00 UTC)
    - cron: '5 20 * * 1-5'
    # After after-hours ends (8:00 PM ET = 00:00 UTC+1)
    - cron: '5 0 * * 2-6'
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Predictive Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python predictive_scanner.py

      - name: Train Model (after last session)
        # Runs after the after-hours scan (5 0 * * 2-6) using the standalone trainer.
        # train_models.py exits 1 when fewer than 30 labeled rows exist, so the job
        # keeps running (continue-on-error) until enough data accumulates.
        if: github.event.schedule == '5 0 * * 2-6'
        continue-on-error: true
        run: python train_models.py

      - name: Commit results
        run: |
          git config user.name "whale-scanner"
          git config user.email "scanner@github-actions"
          git add scan_results.json predictions.json explosion_model.pkl scanner_history.db
          git diff --staged --quiet || git commit -m "Predictions $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
